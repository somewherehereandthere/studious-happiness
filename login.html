<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VDCertify — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eff6ff' } }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

<div x-data="loginApp()" class="w-full max-w-sm">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-brand rounded-xl mb-4 shadow-lg">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900">VDCertify</h1>
    <p class="text-slate-500 text-sm mt-1">Resume Engine</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h2 class="text-lg font-semibold text-slate-800 mb-6">Sign in to your account</h2>

    <!-- Error -->
    <div x-show="error" x-cloak
         class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"
         x-text="error"></div>

    <form @submit.prevent="submit" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input x-model="email" type="email" required autocomplete="email"
               placeholder="you@example.com"
               :disabled="loading"
               class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm
                      focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent
                      disabled:bg-slate-50 disabled:text-slate-400 transition"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <div class="relative">
          <input x-model="password" :type="showPw ? 'text' : 'password'" required
                 autocomplete="current-password" placeholder="••••••••"
                 :disabled="loading"
                 class="w-full px-3 py-2.5 pr-10 rounded-lg border border-slate-300 text-sm
                        focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent
                        disabled:bg-slate-50 disabled:text-slate-400 transition"/>
          <button type="button" @click="showPw = !showPw" tabindex="-1"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <svg x-show="!showPw" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                       -1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg x-show="showPw" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7
                       a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243
                       M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29
                       M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7
                       a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" :disabled="loading"
              class="w-full py-2.5 px-4 bg-brand hover:bg-brand-dark text-white text-sm font-medium
                     rounded-lg transition focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2
                     disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg x-show="loading" x-cloak class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        <span x-text="loading ? 'Signing in…' : 'Sign in'"></span>
      </button>
    </form>
  </div>

  <p class="text-center text-xs text-slate-400 mt-6">VDCertify Resume Engine</p>
</div>

<script>
  const API = window.location.origin;

  function loginApp() {
    return {
      email: '', password: '', showPw: false, loading: false, error: '',

      async submit() {
        this.error = '';
        this.loading = true;
        try {
          const res = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: this.email, password: this.password }),
          });
          const data = await res.json();
          if (!res.ok) { this.error = data.error || 'Login failed'; return; }
          localStorage.setItem('rt_access',  data.accessToken);
          localStorage.setItem('rt_refresh', data.refreshToken);
          localStorage.setItem('rt_user',    JSON.stringify(data.user));
          window.location.href = data.user.role === 'ADMIN' ? '/admin' : '/app';
        } catch {
          this.error = 'Cannot reach server. Try again.';
        } finally {
          this.loading = false;
        }
      }
    }
  }

  // Already logged in? Redirect.
  (function() {
    const token = localStorage.getItem('rt_access');
    const user  = localStorage.getItem('rt_user');
    if (token && user) {
      try {
        const u = JSON.parse(user);
        window.location.href = u.role === 'ADMIN' ? '/admin' : '/app';
      } catch {}
    }
  })();
</script>
</body>
</html>
